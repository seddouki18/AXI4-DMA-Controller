<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b2b2b"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e7d32"/>
    </marker>
  </defs>
  <rect width="980" height="470" fill="#ffffff"/>
  <text x="490" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b1b1b">dma_engine FSM (V1)</text>

  <!-- states -->
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <rect x="60"  y="110" width="150" height="50" rx="25" fill="#eef3fa" stroke="#1f5fa8" stroke-width="2"/>
    <text x="135" y="140">IDLE</text>
    <rect x="290" y="110" width="150" height="50" rx="25" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.6"/>
    <text x="365" y="140">PLAN</text>
    <rect x="520" y="110" width="150" height="50" rx="25" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.6"/>
    <text x="595" y="133">AR_REQ</text>
    <rect x="750" y="110" width="150" height="50" rx="25" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.6"/>
    <text x="825" y="133">R_DATA</text>
    <rect x="750" y="290" width="150" height="50" rx="25" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.6"/>
    <text x="825" y="313">AW_REQ</text>
    <rect x="520" y="290" width="150" height="50" rx="25" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.6"/>
    <text x="595" y="313">PREFETCH</text>
    <rect x="290" y="290" width="150" height="50" rx="25" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.6"/>
    <text x="365" y="313">W_DATA</text>
    <rect x="60"  y="290" width="150" height="50" rx="25" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.6"/>
    <text x="135" y="313">B_RESP</text>
    <rect x="750" y="395" width="150" height="50" rx="25" fill="#fbeceb" stroke="#b3261e" stroke-width="2"/>
    <text x="825" y="418" fill="#b3261e">FAULT</text>
  </g>
  <!-- outputs inside states -->
  <g font-size="10.5" text-anchor="middle" fill="#555">
    <text x="595" y="150">ARVALID=1</text>
    <text x="825" y="150">RREADY=1</text>
    <text x="825" y="330">AWVALID=1</text>
    <text x="595" y="330">RAM read word 0</text>
    <text x="365" y="330">WVALID=1, WLAST</text>
    <text x="135" y="330">BREADY=1</text>
    <text x="825" y="435" fill="#b3261e">BUSY=1, all low</text>
  </g>

  <!-- nominal path -->
  <g stroke="#2b2b2b" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <line x1="210" y1="135" x2="288" y2="135"/>
    <line x1="440" y1="135" x2="518" y2="135"/>
    <line x1="670" y1="135" x2="748" y2="135"/>
    <line x1="825" y1="160" x2="825" y2="288"/>
    <line x1="750" y1="315" x2="672" y2="315"/>
    <line x1="520" y1="315" x2="442" y2="315"/>
    <line x1="290" y1="315" x2="212" y2="315"/>
  </g>
  <g font-size="10.5" fill="#1b1b1b" text-anchor="middle">
    <text x="249" y="126">START</text>
    <text x="479" y="120">beats from</text>
    <text x="479" y="130">planner</text>
    <text x="709" y="126">ARREADY</text>
    <text x="831" y="214" text-anchor="start">last beat,</text>
    <text x="831" y="227" text-anchor="start">RRESP OKAY</text>
    <text x="711" y="306">AWREADY</text>
    <text x="481" y="306">1 cycle</text>
    <text x="251" y="300">last beat</text>
    <text x="251" y="310">accepted</text>
  </g>

  <!-- next segment -->
  <path d="M 200 293 L 300 162" stroke="#2b2b2b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <text x="262" y="222" font-size="10.5" fill="#1b1b1b">BVALID, OKAY,</text>
  <text x="262" y="235" font-size="10.5" fill="#1b1b1b">bytes remain</text>

  <!-- DONE / ERROR on B -->
  <line x1="120" y1="290" x2="120" y2="162" stroke="#1e7d32" stroke-width="1.8" marker-end="url(#ag)"/>
  <text x="112" y="215" text-anchor="end" font-size="10.5" fill="#1e7d32">last OKAY:</text>
  <text x="112" y="228" text-anchor="end" font-size="10.5" fill="#1e7d32">DONE</text>
  <line x1="150" y1="290" x2="150" y2="162" stroke="#b3261e" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="156" y="200" font-size="10.5" fill="#b3261e">BRESP</text>
  <text x="156" y="213" font-size="10.5" fill="#b3261e">error:</text>
  <text x="156" y="226" font-size="10.5" fill="#b3261e">ERROR</text>
  <text x="156" y="239" font-size="10.5" fill="#b3261e">4, 5, 7</text>

  <!-- R error back to IDLE -->
  <path d="M 825 110 L 825 70 L 135 70 L 135 108" stroke="#b3261e" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <text x="480" y="62" text-anchor="middle" font-size="10.5" fill="#b3261e">last beat of a burst with an RRESP error: ERROR, codes 2, 3, 7 (the whole burst is drained, no AW)</text>

  <!-- protocol faults -->
  <path d="M 900 135 L 940 135 L 940 420 L 902 420" stroke="#b3261e" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <text x="944" y="250" font-size="10.5" fill="#b3261e">RLAST</text>
  <text x="944" y="263" font-size="10.5" fill="#b3261e">or RID</text>
  <text x="944" y="276" font-size="10.5" fill="#b3261e">wrong</text>
  <text x="944" y="289" font-size="10.5" fill="#b3261e">(6)</text>
  <path d="M 135 340 L 135 420 L 748 420" stroke="#b3261e" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <text x="440" y="412" text-anchor="middle" font-size="10.5" fill="#b3261e">BID wrong (code 6)</text>

  <text x="20" y="460" font-size="10.5" fill="#555">Every state waits while its handshake is not done (VALID and payload held). aresetn = 0 returns any state to IDLE; it is the only exit from FAULT.</text>
</svg>
